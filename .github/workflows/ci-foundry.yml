name: CI - Foundry tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry (forge & cast)
        run: |
          curl -sSfL https://foundry.paradigm.xyz | bash || true
          for dir in "$HOME/.foundry/bin" "$HOME/.config/.foundry/bin" "$HOME/.config/foundry/bin"; do
            if [ -d "$dir" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              export PATH="$dir:$PATH"
            fi
          done
          foundryup || echo "foundryup verification reported an issue; continuing to validate forge" >&2
          forge_path="$(find "$HOME" -maxdepth 6 -type f -name forge -executable -print -quit 2>/dev/null || true)"
          if [ -n "$forge_path" ]; then
            forge_dir="$(dirname "$forge_path")"
            echo "$forge_dir" >> "$GITHUB_PATH"
            export PATH="$forge_dir:$PATH"
          fi
          command -v forge
          forge --version

      - name: Install Python tools (optional for slither/mythril)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common git curl build-essential
          python3 -m pip install --upgrade pip
          pip3 install slither-analyzer mythril || true

      - name: Install project deps (if any)
        run: |
          echo "No project-specific install steps defined"

      - name: Run Foundry tests
        run: forge test -vvvv
