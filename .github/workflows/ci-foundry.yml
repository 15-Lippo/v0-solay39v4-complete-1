name: CI - Foundry tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry (forge & cast)
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          source "$HOME/.bashrc" || true
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup || echo "foundryup verification reported an issue; continuing to validate forge" >&2
          VERSION_DIR="$(find "$HOME/.foundry/versions/foundry-rs/foundry" -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort -V | tail -n 1)"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          if [ -n "$VERSION_DIR" ]; then echo "$VERSION_DIR" >> "$GITHUB_PATH"; export PATH="$VERSION_DIR:$PATH"; fi
          command -v forge
          forge --version

      - name: Install Python tools (optional for slither/mythril)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common git curl build-essential
          python3 -m pip install --upgrade pip
          pip3 install slither-analyzer mythril || true

      - name: Install project deps (if any)
        run: |
          echo "No project-specific install steps defined"

      - name: Run Foundry tests
        run: forge test -vvvv
