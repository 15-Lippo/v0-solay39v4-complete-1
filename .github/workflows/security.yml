name: Security checks (Slither + Foundry + Mythril + Echidna)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install slither-analyzer mythril
      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          foundryup
          forge --version
      - name: Run Slither
        run: slither . --config-file slither.config.json --json slither-report.json || true
      - name: Run Forge tests
        run: forge test -vvvv
      - name: Run Echidna invariants
        run: |
          if command -v echidna-test >/dev/null 2>&1 && [ -f echidna/echidna.yaml ]; then
            echidna-test echidna --config echidna/echidna.yaml
          else
            echo "Echidna is not installed; run it in the dedicated security environment."
          fi

      - name: Run Mythril analysis
        run: |
          myth analyze contracts/Solay39EnterpriseRegistry.sol -o json --execution-timeout 120 > mythril-report.json || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            slither-report.json
            mythril-report.json
            out
