name: Security checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Foundry install
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            ~/.cache/foundry
          key: foundry-${{ runner.os }}-v1

      - name: Install isolated analysis tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m venv "$RUNNER_TEMP/slither-tools"
          "$RUNNER_TEMP/slither-tools/bin/python" -m pip install --upgrade pip setuptools wheel
          "$RUNNER_TEMP/slither-tools/bin/python" -m pip install --upgrade slither-analyzer
          export PATH="$RUNNER_TEMP/slither-tools/bin:$PATH"
          echo "$RUNNER_TEMP/slither-tools/bin" >> "$GITHUB_PATH"
          slither --version

          # Mythril currently resolves legacy NumPy dependencies that can fail on
          # the runner Python. Keep it isolated and make its availability explicit
          # so Forge/Slither reports and the always-run artifact upload are retained.
          python -m venv "$RUNNER_TEMP/mythril-tools"
          if "$RUNNER_TEMP/mythril-tools/bin/python" -m pip install --upgrade pip wheel mythril && "$RUNNER_TEMP/mythril-tools/bin/python" -m pip install 'setuptools<81'; then
            export PATH="$RUNNER_TEMP/mythril-tools/bin:$PATH"
            echo "$RUNNER_TEMP/mythril-tools/bin" >> "$GITHUB_PATH"
            if myth version; then
              echo "Mythril is available."
            else
              echo "Mythril installed but unavailable at runtime; continuing with Mythril skipped." | tee reports/mythril_output.txt
            fi
          else
            echo "Mythril installation failed; continuing with Mythril skipped." | tee reports/mythril_output.txt
          fi
      - name: Install Foundry
        shell: bash
        run: |
          set -euxo pipefail
          curl -L https://foundry.paradigm.xyz | bash
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          "$HOME/.foundry/bin/foundryup"
          "$HOME/.foundry/bin/forge" --version
      - name: Run Forge tests
        run: forge test -vvvv | tee reports/forge_output.txt
      - name: Run Forge coverage
        if: always()
        run: forge coverage --report summary --report lcov | tee reports/coverage.txt || true
      - name: Run Slither
        if: always()
        run: slither . --config-file slither.config.json --json reports/slither-report.json || true
      - name: Fail on Slither high or critical findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/slither-report.json")
          data = json.loads(p.read_text())
          issues = data.get("results", {}).get("detectors", data.get("results", []))
          bad = [i for i in issues if str(i.get("impact", "")).lower() in {"high", "critical"}]
          if bad:
              raise SystemExit(f"Slither found {len(bad)} high/critical finding(s)")
          print("No Slither high/critical findings")
          PY
      - name: Run Mythril
        if: ${{ always() && hashFiles('reports/mythril_output.txt') == '' }}
        run: |
          if ! command -v myth >/dev/null 2>&1; then
            echo "Mythril unavailable; skipping." | tee reports/mythril_output.txt
            exit 0
          fi
          for contract in contracts/Solay39EnterpriseRegistry.sol contracts/Solay39AuditRegistry.sol contracts/AuditRegistry.sol; do
            name="$(basename "$contract" .sol)"
            myth analyze "$contract" -o json --execution-timeout 120 > "reports/mythril-${name}.json" || true
          done
      - name: Fail on Mythril high or critical findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path("reports").glob("mythril-*.json"))
          bad = []
          for report in reports:
              data = json.loads(report.read_text())
              for issue in data.get("issues", []):
                  if str(issue.get("severity", "")).lower() in {"high", "critical"}:
                      bad.append((report.name, issue))
          if bad:
              raise SystemExit(f"Mythril found {len(bad)} high/critical finding(s)")
          print("No Mythril high/critical findings")
          PY
      - name: Run Echidna
        if: hashFiles('echidna/echidna.yaml', 'echidna/EchidnaHarness.sol') != ''
        uses: crytic/echidna-action@v2
        with:
          files: .
          contract: EchidnaHarness
          config: echidna/echidna.yaml
          format: text
          output: reports/echidna_output.txt
      - name: Aggregate security reports
        if: always()
        run: |
          mkdir -p reports
          python3 scripts/aggregate_reports.py --reports-dir reports --out reports/summary.json
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/**/*.json
            reports/*.txt
            out/**
          if-no-files-found: warn
        
