name: Security checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer mythril
          mkdir -p reports
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Run Forge tests
        run: forge test -vvvv | tee reports/forge_output.txt
      - name: Run Forge coverage
        run: forge coverage --report summary --report lcov | tee reports/coverage.txt
      - name: Run Slither
        run: slither . --config-file slither.config.json --json reports/slither-report.json
      - name: Fail on Slither high or critical findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/slither-report.json")
          data = json.loads(p.read_text())
          issues = data.get("results", {}).get("detectors", data.get("results", []))
          bad = [i for i in issues if str(i.get("impact", "")).lower() in {"high", "critical"}]
          if bad:
              raise SystemExit(f"Slither found {len(bad)} high/critical finding(s)")
          print("No Slither high/critical findings")
          PY
      - name: Run Mythril
        run: |
          for contract in contracts/Solay39EnterpriseRegistry.sol contracts/Solay39AuditRegistry.sol contracts/AuditRegistry.sol; do
            name="$(basename "$contract" .sol)"
            myth analyze "$contract" -o json --execution-timeout 120 > "reports/mythril-${name}.json"
          done
      - name: Fail on Mythril high or critical findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path("reports").glob("mythril-*.json"))
          bad = []
          for report in reports:
              data = json.loads(report.read_text())
              for issue in data.get("issues", []):
                  if str(issue.get("severity", "")).lower() in {"high", "critical"}:
                      bad.append((report.name, issue))
          if bad:
              raise SystemExit(f"Mythril found {len(bad)} high/critical finding(s)")
          print("No Mythril high/critical findings")
          PY
      - name: Run Echidna
        if: hashFiles('echidna/echidna.yaml', 'echidna/EchidnaHarness.sol') != ''
        uses: crytic/echidna-action@v2
        with:
          files: .
          contract: EchidnaHarness
          config: echidna/echidna.yaml
          format: text
          output: reports/echidna_output.txt
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/
            out
          if-no-files-found: ignore
        
